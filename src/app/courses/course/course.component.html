<div class="page-container">
    <div class="course-layout">

        <aside class="course-sidebar">
            <div class="course-hero">
                <img class="course-image" [src]="course().iconUrl" [alt]="course().description">
                <h1 class="course-title">{{ course().description }}</h1>
                @if (couponCode()) {
                    <div class="coupon-badge">
                        🎉 Use code <strong>{{ couponCode() }}</strong> for a discount!
                    </div>
                }

                <div class="course-settings">
                    <button class="captions-toggle" [class.active]="captionsEnabled()"
                            (click)="captionsEnabled.set(!captionsEnabled())">
                        <span class="material-icons">closed_caption</span>
                        Captions {{ captionsEnabled() ? 'On' : 'Off' }}
                    </button>
                </div>

                <div class="course-progress">
                    <div class="course-progress-header">
                        <span class="course-progress-label">Your progress</span>
                        <span class="course-progress-count">{{ progress.visitedCount() }} / {{ course().lessonsCount }}</span>
                    </div>
                    <div class="course-progress-track">
                        <div class="course-progress-fill" [style.width.%]="progressPercent()"></div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="course-content">

            <a class="back-link" routerLink="/courses">
                <span class="material-icons" aria-hidden="true">arrow_back</span>
                All Courses
            </a>

            <!-- router-outlet goes here -->
            <router-outlet />

        </div>

    </div>
</div>
